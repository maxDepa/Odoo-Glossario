<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossario Odoo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f4;
    color: #1c1c1c;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
    color: #111;
  }
  .subtitle {
    font-size: 0.9rem;
    color: #888;
    margin-bottom: 1.75rem;
  }

  /* ── App tabs ── */
  .app-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 1rem;
  }
  .app-tab {
    font-size: 13px;
    padding: 5px 16px;
    border-radius: 20px;
    border: 1px solid #d4d4d4;
    background: #fff;
    color: #555;
    cursor: pointer;
    font-weight: 500;
    transition: all .15s;
  }
  .app-tab:hover { border-color: #aaa; color: #222; }
  .app-tab.active { color: #fff; border-color: transparent; }
  .app-tab.active.all      { background: #333; }
  .app-tab.active.purchase { background: #0C447C; }
  .app-tab.active.sales    { background: #A0391A; }
  .app-tab.active.crm      { background: #1A6B3C; }
  .app-tab.active.contacts { background: #555; }

  /* ── Legend ── */
  .legend {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: #888;
    margin-bottom: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .app-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .dot-purchase { background: #0C447C; }
  .dot-sales    { background: #A0391A; }
  .dot-crm      { background: #1A6B3C; }
  .dot-contacts { background: #777; }
  .dot-both     { background: linear-gradient(135deg, #0C447C 50%, #A0391A 50%); }
  .dot-multi    { background: conic-gradient(#0C447C 0deg 90deg, #A0391A 90deg 180deg, #1A6B3C 180deg 270deg, #777 270deg 360deg); }

  /* ── Search ── */
  .search-box {
    width: 100%;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid #d4d4d4;
    background: #fff;
    color: #1c1c1c;
    font-size: 14px;
    margin-bottom: 1.25rem;
    outline: none;
    transition: border-color .15s;
  }
  .search-box:focus { border-color: #888; }

  /* ── Filter bar ── */
  .filter-bar {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 1.4rem;
  }
  .filter-btn {
    font-size: 12px;
    padding: 4px 13px;
    border-radius: 20px;
    border: 1px solid #d4d4d4;
    background: #fff;
    color: #666;
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover { border-color: #aaa; color: #222; }
  .filter-btn.active {
    background: #e8e8e8;
    color: #111;
    border-color: #aaa;
    font-weight: 500;
  }

  /* ── Term list ── */
  .term-list { display: flex; flex-direction: column; gap: 10px; }

  .term-card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    transition: border-color .15s, box-shadow .15s;
  }
  .term-card:hover {
    border-color: #ccc;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }

  .term-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 7px;
    flex-wrap: wrap;
  }
  .term-name {
    font-size: 15px;
    font-weight: 600;
    color: #111;
  }
  .term-badge {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 20px;
    white-space: nowrap;
    font-weight: 500;
  }
  .term-def {
    font-size: 14px;
    color: #444;
    line-height: 1.65;
  }
  .term-note {
    font-size: 12px;
    color: #888;
    margin-top: 7px;
    font-style: italic;
    border-left: 2px solid #e0e0e0;
    padding-left: 8px;
  }

  .empty {
    color: #aaa;
    font-size: 14px;
    padding: 1.5rem 0;
    text-align: center;
  }

  /* ── Badge colors ── */
  .b-ordini    { background: #deedfb; color: #0C447C; }
  .b-tempi     { background: #eaebfd; color: #3C3489; }
  .b-accordi   { background: #d9f1e7; color: #085041; }
  .b-controllo { background: #faeada; color: #633806; }
  .b-config    { background: #efefeb; color: #444441; }
  .b-logistica { background: #fae9e4; color: #712B13; }
  .b-prodotti  { background: #fbe8ef; color: #72243E; }
  .b-dev       { background: #e5f2d8; color: #27500A; }
  .b-promo     { background: #f0e8fa; color: #52218A; }
  .b-pricing   { background: #fff5d6; color: #7A5500; }
  .b-crm       { background: #d8f0e5; color: #1A6B3C; }
  .b-contacts  { background: #ebebeb; color: #444; }

  /* ── Count ── */
  .count {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 0.75rem;
  }

  @media (max-width: 600px) {
    body { padding: 1rem 0.75rem; }
    h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📖 Glossario Odoo</h1>
  <p class="subtitle">Purchase · Sales · CRM · Contacts — <span id="total-count"></span> termini</p>

  <div class="app-tabs">
    <button class="app-tab active all"   id="tab-all"      onclick="setApp('all')">Tutti</button>
    <button class="app-tab purchase"     id="tab-purchase" onclick="setApp('purchase')">📦 Purchase</button>
    <button class="app-tab sales"        id="tab-sales"    onclick="setApp('sales')">🛒 Sales</button>
    <button class="app-tab crm"          id="tab-crm"      onclick="setApp('crm')">🎯 CRM</button>
    <button class="app-tab contacts"     id="tab-contacts" onclick="setApp('contacts')">👤 Contacts</button>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="app-dot dot-purchase"></span>Purchase</span>
    <span class="legend-item"><span class="app-dot dot-sales"></span>Sales</span>
    <span class="legend-item"><span class="app-dot dot-crm"></span>CRM</span>
    <span class="legend-item"><span class="app-dot dot-contacts"></span>Contacts</span>
    <span class="legend-item"><span class="app-dot dot-both"></span>Purchase + Sales</span>
    <span class="legend-item"><span class="app-dot dot-multi"></span>Tutte le app</span>
  </div>

  <input class="search-box" type="text" placeholder="Cerca un termine o parola chiave…" id="search" oninput="render()"/>
  <div class="filter-bar" id="filters"></div>
  <div class="count" id="count"></div>
  <div class="term-list" id="list"></div>
</div>

<script>
const TERMS=[
  // ── PURCHASE ──────────────────────────────────────────────────────
  {name:"P2P — Procure to Pay",cat:"ordini",badge:"b-ordini",app:"purchase",
   def:"Processo end-to-end dall'identificazione del fabbisogno al pagamento del fornitore. In Odoo: RFQ → PO → Ricezione merce → Vendor Bill → Pagamento."},
  {name:"RFQ — Request for Quotation",cat:"ordini",badge:"b-ordini",app:"both",
   def:"Preventivo inviato a un fornitore. Può nascere manualmente, da Reordering Rules, da un SO confermato (MTO) o da un Purchase Agreement. Una volta confermata diventa un PO.",
   note:"RFQ ≠ PO: è solo una richiesta senza impegno formale."},
  {name:"PO — Purchase Order",cat:"ordini",badge:"b-ordini",app:"purchase",
   def:"Ordine di acquisto confermato. Legalmente vincolante verso il fornitore. State machine: draft → sent → purchase → done."},
  {name:"Vendor Bill",cat:"ordini",badge:"b-ordini",app:"purchase",
   def:"Fattura passiva del fornitore (account.move, move_type='in_invoice'). Generabile su ordine o su ricezione in base al Bill Control.",
   note:"Può arrivare prima o dopo la ricezione fisica della merce."},
  {name:"Stock Picking",cat:"ordini",badge:"b-ordini",app:"both",
   def:"Documento di magazzino generato alla conferma di un PO (ricezione) o di un SO (spedizione). Traccia il movimento fisico della merce. Può essere parziale o suddiviso in più picking."},
  {name:"Stock Moves",cat:"ordini",badge:"b-ordini",app:"both",
   def:"Movimenti di magazzino generati da PO o SO. Ogni riga ordine genera un movimento che traccia quantità, prodotto, provenienza e destinazione."},
  {name:"Vendor",cat:"prodotti",badge:"b-prodotti",app:"purchase",
   def:"Fornitore registrato come res.partner. Su ogni prodotto si configurano uno o più vendor con pricelist, quantità minima e lead time specifici."},
  {name:"Product — tipo",cat:"prodotti",badge:"b-prodotti",app:"both",
   def:"Storable (a magazzino, genera Stock Moves), Consumable (non tracciato), Service (non fisico, non genera ricezione/spedizione). I servizi possono però generare fatture, task e progetti.",
   note:"Solo i prodotti Storable generano un picking alla conferma del PO/SO."},
  {name:"Taxes",cat:"prodotti",badge:"b-prodotti",app:"both",
   def:"Imposte configurate sulle righe di PO/Vendor Bill (acquisto) o SO/Invoice (vendita). Definibili come fiscal positions per fornitore/cliente o prodotto, applicate automaticamente."},
  {name:"Vendor Pricelist",cat:"pricing",badge:"b-pricing",app:"purchase",
   def:"Listino prezzi per fornitore nel tab Purchase. Il fornitore in cima è il default. Il prezzo effettivo dipende da fornitore + quantità ordinata."},
  {name:"Price Selection",cat:"pricing",badge:"b-pricing",app:"purchase",
   def:"Logica con cui Odoo sceglie il prezzo in una RFQ: vendor prioritario, quantità minima d'ordine, regole di sconto."},
  {name:"Routes — Buy / Manufacture / Dropship",cat:"logistica",badge:"b-logistica",app:"both",
   def:"Regole logistiche sul prodotto. Buy genera una RFQ; Manufacture avvia un ordine di produzione; Dropship fa spedire direttamente il fornitore al cliente finale."},
  {name:"Replenishment",cat:"logistica",badge:"b-logistica",app:"purchase",
   def:"Riapprovvigionamento dello stock. Avviabile manualmente, dallo scheduler (Reordering Rules) o da MRP."},
  {name:"MRP — Material Requirements Planning",cat:"logistica",badge:"b-logistica",app:"purchase",
   def:"Modulo che pianifica i fabbisogni di materiali per la produzione. Genera RFQ/PO automatici per i componenti mancanti."},
  {name:"MTO — Make to Order",cat:"logistica",badge:"b-logistica",app:"both",
   def:"Acquisto/produzione avviati solo alla conferma del SO, senza tenere scorta. Genera automaticamente una RFQ collegata al SO.",
   note:"Opposto di MTS (Make to Stock)."},
  {name:"Dropshipping",cat:"logistica",badge:"b-logistica",app:"both",
   def:"La merce va direttamente dal fornitore al cliente senza passare dal magazzino. Route configurabile sul prodotto. Sul SO compare lo smart button 'Dropshipping' al posto del normale Delivery."},
  {name:"Subcontracting",cat:"logistica",badge:"b-logistica",app:"purchase",
   def:"Produzione affidata a un terzista. I componenti vengono inviati al terzista; il prodotto finito rientra in magazzino tramite PO."},
  {name:"Lead Time",cat:"tempi",badge:"b-tempi",app:"both",
   def:"Tempo totale tra avvio e completamento di un processo. In acquisti: Vendor Lead Time + Purchase Security Lead Time + Days to Purchase.",
   note:"Esempio: 7gg + 2gg + 1gg = 10 gg totali."},
  {name:"Vendor Lead Time",cat:"tempi",badge:"b-tempi",app:"purchase",
   def:"Giorni tra invio ordine al fornitore e ricezione merce. Configurabile sul prodotto o sul singolo fornitore."},
  {name:"Purchase Security Lead Time",cat:"tempi",badge:"b-tempi",app:"purchase",
   def:"Cuscinetto di giorni aggiuntivi dopo il Vendor Lead Time per assorbire imprevisti."},
  {name:"Days to Purchase",cat:"tempi",badge:"b-tempi",app:"purchase",
   def:"Giorni di anticipo con cui bisogna emettere l'ordine rispetto alla data di necessità."},
  {name:"Reordering Rules",cat:"config",badge:"b-config",app:"purchase",
   def:"Regole sul prodotto (min/max stock). Lo scheduler genera RFQ automatiche quando la scorta scende sotto il minimo.",
   note:"Rilanciabile da Inventory → Operations → Run Scheduler."},
  {name:"Scheduler / Cron",cat:"config",badge:"b-config",app:"purchase",
   def:"Processo automatico giornaliero che verifica le Reordering Rules e genera RFQ/PO. Considera la quantità della rule e il fabbisogno da SO in attesa."},
  {name:"Bill Control",cat:"controllo",badge:"b-controllo",app:"both",
   def:"Determina quando emettere la fattura: su Ordered Quantities (subito) o su Received/Delivered Quantities (dopo consegna). Sovrascrivibile per singolo prodotto."},
  {name:"3-Way Matching",cat:"controllo",badge:"b-controllo",app:"purchase",
   def:"Verifica automatica di coerenza tra PO, ricezione merce e Vendor Bill. Blocca pagamenti per merce non ricevuta o importi discordanti."},
  {name:"Purchase Order Approval",cat:"controllo",badge:"b-controllo",app:"purchase",
   def:"Blocca le RFQ oltre una soglia di importo in 'To Approve'. Solo gli admin possono trasformarle in PO."},
  {name:"Warning / Blocking Message",cat:"controllo",badge:"b-controllo",app:"both",
   def:"Avvisi su fornitori o prodotti. Blocking Message bloccano l'operazione; Warning la segnalano senza bloccarla."},
  {name:"State Machine — PO",cat:"dev",badge:"b-dev",app:"purchase",
   def:"Ciclo di vita del PO: draft → sent → purchase → done. Transizione principale: button_confirm().",
   note:"Modello ORM: purchase.order"},
  {name:"purchase.order.line",cat:"dev",badge:"b-dev",app:"purchase",

  {name:"res.partner",cat:"dev",badge:"b-dev",app:"multi",

  {name:"account.move",cat:"dev",badge:"b-dev",app:"both",

  {name:"_prepare_* / _compute_* / _onchange_*",cat:"dev",badge:"b-dev",app:"both",
   def:"Pattern ORM: _prepare_* costruisce dizionari per creare record; _compute_* calcola campi derivati; _onchange_* reagisce a modifiche UI aggiornando altri campi dinamicamente."},
  {name:"Call for Tenders",cat:"accordi",badge:"b-accordi",app:"purchase",
   def:"Gara d'appalto: più fornitori, confronto offerte, selezione migliore. Le RFQ degli altri vengono annullate automaticamente."},
  {name:"Blanket Order",cat:"accordi",badge:"b-accordi",app:"purchase",
   def:"Accordo quadro a lungo termine con un fornitore, dilazionato nel tempo. Si chiude quando tutte le RFQ diventano PO."},
  {name:"Alternative RFQ",cat:"accordi",badge:"b-accordi",app:"purchase",
   def:"RFQ parallela per confrontare prezzi e tempi tra fornitori diversi. Si conferma la migliore e si annullano le altre."},
  {name:"Purchase Template",cat:"accordi",badge:"b-accordi",app:"purchase",
   def:"Base riutilizzabile per generare RFQ con prodotti e quantità precompilati. Quantità a zero nel template; stesso fornitore per tutte le RFQ generate."},
  {name:"Purchase Agreement",cat:"accordi",badge:"b-accordi",app:"purchase",
   def:"Contenitore per accordi strutturati con fornitori: Call for Tenders, Blanket Orders, Alternative RFQs, Purchase Templates."},
  {name:"EDI — Electronic Data Interchange",cat:"config",badge:"b-config",app:"both",
   def:"Protocollo di comunicazione automatica tra aziende: un PO dell'acquirente genera automaticamente un SO nel sistema del fornitore."},

  // ── SALES ─────────────────────────────────────────────────────────
  {name:"O2C — Order to Cash",cat:"ordini",badge:"b-ordini",app:"sales",
   def:"Processo end-to-end lato vendita: Lead → Quotation → SO → Delivery → Invoice → Payment.",
   note:"Speculare al P2P lato Purchase. La catena completa lega Sales → Inventory → Accounting."},
  {name:"Quotation",cat:"ordini",badge:"b-ordini",app:"sales",
   def:"Preventivo commerciale inviato al cliente. Accettata dal cliente, diventa automaticamente un Sales Order. Può nascere da zero, da un template o direttamente da un'Opportunity nel CRM.",

  {name:"SO — Sales Order",cat:"ordini",badge:"b-ordini",app:"sales",

  {name:"Customer Invoice",cat:"ordini",badge:"b-ordini",app:"sales",

  {name:"Subscription / Servizi ricorrenti",cat:"ordini",badge:"b-ordini",app:"sales",

  {name:"Advance Payment",cat:"ordini",badge:"b-ordini",app:"sales",
   def:"Fattura parziale emessa prima della consegna. Può essere percentuale, importo fisso o totalità dell'ordine.",

  {name:"Delivery / Spedizione",cat:"logistica",badge:"b-logistica",app:"sales",

  {name:"Delivery Method",cat:"logistica",badge:"b-logistica",app:"sales",

  {name:"Route-driven Logic",cat:"logistica",badge:"b-logistica",app:"both",
   def:"Il comportamento logistico è determinato dalle Route sul prodotto, non dalla logica dell'ordine. La stessa riga SO può generare un picking da stock, una RFQ o un MO a seconda della route attiva."},
  {name:"Invoicing Policy",cat:"controllo",badge:"b-controllo",app:"both",

  {name:"Milestone (invoicing)",cat:"controllo",badge:"b-controllo",app:"sales",
   def:"Le delivered quantities vengono aggiornate al completamento di milestone nell'App Project. Fatturazione a step legati all'avanzamento del progetto."},
  {name:"Timesheet (invoicing)",cat:"controllo",badge:"b-controllo",app:"sales",
   def:"Fatturazione per prodotti Service basata sulle ore registrate nei timesheet collegati al SO."},
  {name:"Quotation Template",cat:"config",badge:"b-config",app:"sales",
   def:"Template riutilizzabile per Quotation con prodotti, optional products, T&C precompilati. Configurabile con durata, journal, pagamento e firma online."},
  {name:"PDF Quote Builder",cat:"config",badge:"b-config",app:"sales",
   def:"Personalizzazione del PDF della Quotation con header, footer e parametri dinamici. Documenti allegabili con visibilità: Hidden, OnQuote, OnConfirmedOrder."},
  {name:"Online Signature / Online Payment",cat:"config",badge:"b-config",app:"sales",
   def:"Permettono al cliente di firmare digitalmente o pagare dal portale. Se paga online, il SO viene confermato e la fattura generata automaticamente."},
  {name:"Optional Products",cat:"prodotti",badge:"b-prodotti",app:"sales",
   def:"Prodotti aggiuntivi suggeriti al cliente nella Quotation (upselling). Il cliente può scegliere se aggiungerli prima di confermare."},
  {name:"Product Packaging",cat:"prodotti",badge:"b-prodotti",app:"sales",
   def:"Unità di imballo configurabili per un prodotto (es. scatola da 6, pallet da 100). Permette di vendere e spedire in multipli definiti."},
  {name:"Product Variants",cat:"prodotti",badge:"b-prodotti",app:"sales",

  {name:"Product Documents",cat:"prodotti",badge:"b-prodotti",app:"sales",
   def:"File o URL allegati al prodotto. Integrabili nel PDF Quote Builder con visibilità Hidden / OnQuote / OnConfirmedOrder."},
  {name:"Pricelist (Sales)",cat:"pricing",badge:"b-pricing",app:"sales",
   def:"Listino prezzi lato vendita applicabile per cliente, paese o segmento. Supporta prezzi fissi, sconti e formule custom. Se Selectable, il cliente può sceglierla online."},
  {name:"Payment Terms",cat:"pricing",badge:"b-pricing",app:"both",

  {name:"Coupon",cat:"promo",badge:"b-promo",app:"sales",

  {name:"Loyalty Program",cat:"promo",badge:"b-promo",app:"sales",
   def:"Programma fedeltà: punti assegnati in base agli acquisti, convertibili in Reward. I Reward vengono aggiunti nella Sales Quotation."},
  {name:"Gift Card",cat:"promo",badge:"b-promo",app:"sales",
   def:"Carta prepagata con valore e scadenza. Emettibile per clienti specifici e usabile come metodo di pagamento su Quotation successive."},
  {name:"Promotion / Discount Program",cat:"promo",badge:"b-promo",app:"sales",
   def:"Programma promozionale con discount code, scadenza opzionale, conditional rules e combinazioni con Coupons e Loyalty Programs."},
  {name:"Sales Tax",cat:"controllo",badge:"b-controllo",app:"sales",
   def:"Imposta sulle righe di vendita. Quattro modalità: Fixed, Percentage of Price, Percentage of Price Tax Included, Python Code."},
  {name:"Commission Plan",cat:"config",badge:"b-config",app:"sales",

const CATS=[
  {key:"all",label:"Tutte"},
  {key:"ordini",label:"Ordini"},
  {key:"tempi",label:"Lead Time"},
  {key:"accordi",label:"Accordi"},
  {key:"logistica",label:"Logistica"},
  {key:"prodotti",label:"Prodotti"},
  {key:"controllo",label:"Controllo"},
  {key:"pricing",label:"Pricing"},
  {key:"promo",label:"Promozioni"},
  {key:"config",label:"Config"},
  {key:"dev",label:"Dev / ORM"},
  {key:"crm",label:"CRM"},
  {key:"contacts",label:"Contacts"},
];

document.getElementById("total-count").textContent = TERMS.length;

let activeApp="all", activeCat="all";

function setApp(app){
  activeApp=app;
  ["all","purchase","sales","crm","contacts"].forEach(a=>{
    const el=document.getElementById("tab-"+a);
    if(el)el.classList.remove("active");
  });
  document.getElementById("tab-"+app).classList.add("active");
  render();
}

const filtersEl=document.getElementById("filters");
const listEl=document.getElementById("list");
const countEl=document.getElementById("count");
const searchEl=document.getElementById("search");

CATS.forEach(c=>{
  const btn=document.createElement("button");
  btn.className="filter-btn"+(c.key==="all"?" active":"");
  btn.textContent=c.label;
  btn.onclick=()=>{
    activeCat=c.key;
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render();
  };
  filtersEl.appendChild(btn);
});

function appMatch(t){
  if(activeApp==="all")return true;
  if(t.app==="multi"||t.app==="both")return true;
  return t.app===activeApp;
}
function dotClass(app){
  if(app==="purchase")return"dot-purchase";
  if(app==="sales")return"dot-sales";
  if(app==="crm")return"dot-crm";
  if(app==="contacts")return"dot-contacts";
  if(app==="both")return"dot-both";
  return"dot-multi";
}
function catLabel(key){return CATS.find(c=>c.key===key)?.label||key;}

function render(){
  const q=searchEl.value.toLowerCase();
  const filtered=TERMS.filter(t=>
    appMatch(t)&&
    (activeCat==="all"||t.cat===activeCat)&&
    (!q||t.name.toLowerCase().includes(q)||t.def.toLowerCase().includes(q)||(t.note&&t.note.toLowerCase().includes(q)))
  );
  countEl.textContent = filtered.length === TERMS.length
    ? `${TERMS.length} termini`
    : `${filtered.length} di ${TERMS.length} termini`;
  listEl.innerHTML=filtered.length?filtered.map(t=>`
    <div class="term-card">
      <div class="term-header">
        <span class="app-dot ${dotClass(t.app)}"></span>
        <span class="term-name">${t.name}</span>
        <span class="term-badge ${t.badge}">${catLabel(t.cat)}</span>
      </div>
      <div class="term-def">${t.def}</div>
      ${t.note?`<div class="term-note">${t.note}</div>`:""}
    </div>
  `).join(""):`<div class="empty">Nessun termine trovato per questa ricerca.</div>`;
}

render();
